<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Command Shopping Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .listening-overlay {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(transparent, rgba(79, 70, 229, 0.1));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .listening-overlay.active { opacity: 1; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col relative pb-24">
    <!-- Header -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center shrink-0">
        <h1 class="text-xl font-bold text-gray-900 flex items-center">
            <i class="fas fa-shopping-basket text-indigo-600 mr-2"></i>Smart Shopper
        </h1>
        <div class="flex gap-2">
            <select id="languageSelect" class="bg-gray-100 text-sm rounded p-2 border-none outline-none focus:ring-2 focus:ring-indigo-300">
                <option value="en-US">English</option>
                <option value="es-ES">Español</option>
                <option value="fr-FR">Français</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col p-4 max-w-3xl mx-auto w-full overflow-hidden">
        
        <!-- Suggestions Area -->
        <section class="mb-4 shrink-0">
            <h2 class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Smart Suggestions</h2>
            <div id="suggestionsContainer" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Shopping List Area -->
        <section class="flex-grow bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
            <div class="p-3 border-b border-gray-100 flex justify-between items-center shrink-0 bg-gray-50/50">
                <h2 class="font-semibold text-gray-700">My List</h2>
                <div class="text-sm text-gray-500"><span id="itemCount" class="font-bold text-indigo-600">0</span> items</div>
            </div>
            
            <div class="overflow-y-auto flex-grow p-4">
                <div id="shoppingList" class="space-y-6">
                    <!-- List empty state -->
                    <div id="emptyState" class="h-full flex flex-col items-center justify-center text-gray-400 py-10">
                        <i class="fas fa-list-ul text-4xl mb-3 text-gray-300"></i>
                        <p>Your list is empty</p>
                        <p class="text-sm mt-1">Tap the mic and say "Add milk"</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Status & Feedback -->
        <div id="feedbackContainer" class="mt-4 p-3 rounded-lg bg-gray-100 text-center text-sm font-medium text-gray-600 transition-all shadow-inner">
            Ready to help. Tap the mic to start.
        </div>

    </main>

    <div class="listening-overlay" id="listeningOverlay"></div>

    <!-- Floating Mic Button -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-10">
        <button id="micBtn" class="bg-indigo-600 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-xl hover:bg-indigo-700 transition-all transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-300">
            <i class="fas fa-microphone text-2xl" id="micIcon"></i>
        </button>
    </div>

    <!-- Search Results Modal -->
    <div id="searchModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900">Search Results</h3>
                <button id="closeSearch" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div id="searchResults" class="space-y-3">
                <!-- Search results injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
